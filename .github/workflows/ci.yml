name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build SPA
        working-directory: frontend
        run: npm run build

  backend:
    name: Java backend and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start backing services
        run: docker compose up -d --wait postgres mongo elasticsearch rabbitmq
      - name: Create isolated test database
        run: docker compose exec -T postgres createdb -U buymore buymore_test
      - name: Test and package
        run: mvn -B -f backend/pom.xml -Pintegration verify
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=80 postgres mongo elasticsearch rabbitmq
      - name: Stop services
        if: always()
        run: docker compose down
