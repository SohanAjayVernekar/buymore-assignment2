# Preview-only nginx config for the standalone container.
# Routes /api to the preview API container on the host, because the preview
# frontend does not run on the docker-compose network (it is visible in the
# Docker Desktop UI instead, on http://localhost:15175).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://host.docker.internal:18003;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / { try_files $uri $uri/ /index.html; }
}
