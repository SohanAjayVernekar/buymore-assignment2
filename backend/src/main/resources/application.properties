server.port=${PORT:8000}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:15434/buymore}
spring.datasource.username=${POSTGRES_USER:buymore}
spring.datasource.password=${POSTGRES_PASSWORD:local_poc_only}
spring.sql.init.mode=always
spring.data.mongodb.uri=${MONGODB_URL:mongodb://localhost:27020/buymore}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:15675}
spring.rabbitmq.username=${RABBITMQ_USER:buymore}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:local_poc_only}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
buymore.elasticsearch-url=${ELASTICSEARCH_URL:http://localhost:19202}
buymore.admin-invitation=${ADMIN_INVITATION_CODE:}
buymore.seed=${SEED_CATALOG:true}
server.error.include-message=never
buymore.elasticsearch-index=${ELASTICSEARCH_INDEX:orders}

# Seed 200 demo products (storefront demo catalog)
buymore.seed200=${SEED_200:false}
# Target catalog size (0 = off); tops the catalog up to this many products
buymore.seed-products=${SEED_PRODUCTS:0}

# Demo login accounts (admin + customer) with "Use test account" buttons
buymore.seed-demo-users=${SEED_DEMO_USERS:true}
